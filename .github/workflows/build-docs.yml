name: Build Docs
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mkdocs build --strict
